<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>秘書ボード</title>
<style>
  /* ---------- tokens ---------- */
  :root{
    --bg:#f3f4f8;--panel:#ffffff;--card:#ffffff;--fg:#141826;--fg-2:#3b4256;--muted:#6f7689;--line:#e4e7ef;--line-2:#eef0f5;
    --accent:#4f46e5;--accent-2:#7c3aed;--accent-soft:#eef0ff;--accent-fg:#fff;
    --ok:#16a34a;--ok-soft:#e9f9ee;--warn:#d97706;--warn-soft:#fff4e0;--danger:#dc2626;--danger-soft:#feeaea;--info:#0284c7;--info-soft:#e6f4fc;
    --shadow:0 1px 2px rgba(20,24,38,.05),0 8px 24px -12px rgba(20,24,38,.14);
    --r:14px;--r-s:9px;--side:236px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0c0e15;--panel:#12151e;--card:#171b26;--fg:#eceef5;--fg-2:#c6cad8;--muted:#8b92a8;--line:#262b3a;--line-2:#1f2431;
    --accent:#818cf8;--accent-2:#a78bfa;--accent-soft:#1f2140;--accent-fg:#0c0e15;
    --ok:#4ade80;--ok-soft:#10261a;--warn:#fbbf24;--warn-soft:#2a2210;--danger:#f87171;--danger-soft:#2c1517;--info:#38bdf8;--info-soft:#0f2231;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.8);}}
  :root[data-theme="dark"]{
    --bg:#0c0e15;--panel:#12151e;--card:#171b26;--fg:#eceef5;--fg-2:#c6cad8;--muted:#8b92a8;--line:#262b3a;--line-2:#1f2431;
    --accent:#818cf8;--accent-2:#a78bfa;--accent-soft:#1f2140;--accent-fg:#0c0e15;
    --ok:#4ade80;--ok-soft:#10261a;--warn:#fbbf24;--warn-soft:#2a2210;--danger:#f87171;--danger-soft:#2c1517;--info:#38bdf8;--info-soft:#0f2231;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.8);}

  /* ---------- base ---------- */
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "Inter",system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;font-feature-settings:"tnum";}
  a{color:var(--accent)}
  button{font:inherit;color:inherit}
  code{font:12px/1.4 ui-monospace,Consolas,"SF Mono",monospace;background:var(--line-2);padding:1px 5px;border-radius:5px}
  .ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;flex:none}
  .emoji{font-size:1.05em;line-height:1}

  /* ---------- layout ---------- */
  .app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
  aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
  .brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;box-shadow:var(--shadow)}
  .brand .mark .ic{width:18px;height:18px;stroke-width:2.2}
  .brand b{font-size:15px;letter-spacing:.01em}
  .brand small{display:block;color:var(--muted);font-size:11px;margin-top:-2px}
  nav.side{display:flex;flex-direction:column;gap:2px}
  nav.side button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--fg-2);text-align:left;transition:background .15s,color .15s}
  nav.side button .ic{width:18px;height:18px;color:var(--muted)}
  nav.side button:hover{background:var(--line-2);color:var(--fg)}
  nav.side button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  nav.side button.active .ic{color:var(--accent)}
  nav.side .cnt{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);background:var(--line-2);padding:0 7px;border-radius:999px;min-width:20px;text-align:center}
  nav.side .cnt.hot{background:var(--danger);color:#fff}
  nav.side .cnt.warm{background:var(--warn);color:#fff}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
  .team-strip{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px}
  .team-strip .av{cursor:pointer;transition:transform .15s}.team-strip .av:hover{transform:translateY(-2px)}
  .side-foot .row{display:flex;align-items:center;justify-content:space-between;padding:0 6px;color:var(--muted);font-size:12px}

  main{min-width:0}
  .topbar{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
  .topbar h1{font-size:20px;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
  .topbar h1 .ic{width:22px;height:22px;color:var(--accent)}
  .topbar .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .topbar .spacer{flex:1}
  .searchbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--panel);min-width:260px;color:var(--muted)}
  .searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
  .searchbox .ic{width:15px;height:15px}
  .searchbox input{border:0;background:transparent;padding:2px 0;outline:none;min-width:0;flex:1}
  .hits{max-height:62vh;overflow:auto;margin:0 -4px;padding:0 4px}
  .hit{padding:10px 0;border-bottom:1px solid var(--line-2)}
  .hit:last-child{border-bottom:0}
  .hit .p{font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--fg-2);word-break:break-all}
  .hit .h{font-weight:600;margin:3px 0}
  .hit .s{font-size:12.5px;color:var(--fg-2);margin-top:2px}
  .hit .s .ln{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
  mark{background:color-mix(in srgb,var(--warn) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
  dialog.wide{width:min(760px,calc(100vw - 32px))}
  .userchip{display:flex;align-items:center;gap:10px;padding:5px 10px 5px 6px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
  .userchip .nm{font-weight:600;font-size:13px;line-height:1.2}.userchip .rl{color:var(--muted);font-size:11.5px}
  .content{padding:22px 26px 60px;max-width:1280px}
  section{display:none;animation:fade .2s ease}section.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;align-items:start;overflow-x:auto}
  .kcol{background:color-mix(in srgb,var(--line-2) 60%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:120px}
  .kcol-h{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--fg-2);margin:2px 4px 10px}
  .kcol-h .ic{width:14px;height:14px}.kcol-h .n{margin-left:auto;color:var(--muted);font-weight:500}
  .tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
  .tcard .top{display:flex;gap:8px;align-items:flex-start}
  .tcard .ct{font-weight:600;font-size:13px;line-height:1.45;flex:1;min-width:0;word-break:break-word}
  .tcard .meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:11.5px;color:var(--muted)}
  .tcard .acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
  .tcard.agent{border-left:3px solid var(--accent)}
  .live{display:inline-flex;align-items:center;gap:5px}
  .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .run{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
  .run:last-child{border-bottom:0}
  @media (max-width:900px){.kanban{grid-template-columns:repeat(4,78vw)}}

  /* ---------- cards & grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .span-all{grid-column:1/-1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
  .card-h{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:13px;font-weight:600;color:var(--fg-2);letter-spacing:.01em}
  .card-h .ic{width:16px;height:16px;color:var(--accent)}
  .card-h .n{margin-left:4px;color:var(--muted);font-weight:500}
  .card-h .right{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:500;color:var(--muted);font-size:12px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:14px}
  .kpi{display:flex;gap:14px;align-items:center;padding:16px 18px}
  .kpi .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
  .kpi .ico .ic{width:22px;height:22px}
  .kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .kpi .l{color:var(--muted);font-size:12.5px;margin-top:2px}
  .t-danger{color:var(--danger);background:var(--danger-soft)}.t-warn{color:var(--warn);background:var(--warn-soft)}.t-ok{color:var(--ok);background:var(--ok-soft)}.t-accent{color:var(--accent);background:var(--accent-soft)}.t-info{color:var(--info);background:var(--info-soft)}.t-muted{color:var(--muted);background:var(--line-2)}
  .empty{color:var(--muted);padding:18px 8px;text-align:center;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .empty .ic{width:26px;height:26px;color:var(--line);stroke-width:1.5}

  /* ---------- badges / chips ---------- */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.6;white-space:nowrap}
  .badge .ic{width:12px;height:12px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;background:var(--line-2);color:var(--fg-2);font-size:12px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .chip .ic{width:12px;height:12px;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .due{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap}
  .due .ic{width:13px;height:13px}
  .due.over{color:var(--danger);font-weight:600}.due.soon{color:var(--warn);font-weight:600}.due.none{color:var(--muted)}
  .muted{color:var(--muted)}.small{font-size:12px}.mono{font:12px/1.5 ui-monospace,Consolas,monospace}

  /* ---------- avatars ---------- */
  .av{display:inline-grid;place-items:center;border-radius:50%;width:32px;height:32px;font-weight:700;font-size:12.5px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 70% 55%),hsl(calc(var(--h) + 40) 70% 45%));box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);flex:none;user-select:none}
  .av .ic{width:55%;height:55%;stroke-width:2}
  .av .emoji{font-size:1.1em}
  .av.lg{width:52px;height:52px;font-size:19px;border-radius:16px}.av.lg .emoji{font-size:1.6em}
  .av.sm{width:22px;height:22px;font-size:10px}
  .av.xl{width:64px;height:64px;font-size:22px;border-radius:20px}.av.xl .emoji{font-size:2em}

  /* ---------- tables ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
  td.who{white-space:nowrap}
  .tscroll{overflow-x:auto;margin:0 -6px;padding:0 6px}
  td.content{min-width:240px}td.nw{white-space:nowrap}
  .seg button{white-space:nowrap}
  @media (max-width:1200px){.seg .lbl-s{display:none}.seg button{padding:5px 7px}}

  /* ---------- buttons / forms ---------- */
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--fg-2);padding:5px 11px;border-radius:var(--r-s);cursor:pointer;font-size:12.5px;font-weight:500;transition:.15s;white-space:nowrap}
  .btn .ic{width:14px;height:14px}
  .btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
  .btn.primary:hover{filter:brightness(1.07);color:#fff}
  .btn.ok{color:var(--ok)}.btn.ok:hover{background:var(--ok-soft);border-color:var(--ok)}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.icon{padding:5px 7px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:var(--card)}
  .seg button{border:0;background:transparent;padding:4px 8px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:4px;font-size:12px;border-right:1px solid var(--line-2)}
  .seg button:last-child{border-right:0}
  .seg button:hover{color:var(--fg);background:var(--line-2)}
  .seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .seg .ic{width:13px;height:13px}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .filters .btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  form.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end;margin-top:14px;padding:14px;border:1px dashed var(--line);border-radius:var(--r-s);background:color-mix(in srgb,var(--line-2) 50%,transparent)}
  form.panel label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
  form.panel label span{display:flex;align-items:center;gap:4px}
  form.panel .wide{grid-column:span 2}
  input,select,textarea{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:var(--r-s);padding:7px 10px;font:inherit;font-size:13px;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
  textarea{min-height:70px;resize:vertical}

  /* ---------- figures ---------- */
  .bar{height:8px;border-radius:999px;background:var(--line-2);overflow:hidden;position:relative}
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}
  .bar.warn i{background:linear-gradient(90deg,var(--warn),#f59e0b)}.bar.danger i{background:linear-gradient(90deg,var(--danger),#f43f5e)}.bar.ok i{background:linear-gradient(90deg,var(--ok),#22c55e)}
  .bar-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
  .ring{width:56px;height:56px;position:relative;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:5;stroke-linecap:round}
  .ring .bg{stroke:var(--line-2)}.ring .fg{stroke:var(--accent);transition:stroke-dasharray .4s}
  .ring .c{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;line-height:1;white-space:nowrap}
  .ring .c small{font-weight:500;color:var(--muted);font-size:9.5px}
  .lv{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--fg-2)}
  .lv .segs{display:inline-flex;gap:2px}.lv .segs i{width:12px;height:6px;border-radius:2px;background:var(--line)}
  .lv .segs i.on{background:var(--accent)}
  .stat{display:flex;flex-direction:column;gap:1px;min-width:64px}
  .stat b{font-size:17px;letter-spacing:-.01em}.stat span{font-size:11px;color:var(--muted)}
  .stats{display:flex;gap:18px;flex-wrap:wrap}

  /* ---------- lists ---------- */
  .item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
  .item:last-child{border-bottom:0;padding-bottom:0}
  .item:first-child{padding-top:0}
  .item .body{flex:1;min-width:0}
  .item .ttl{font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .item .meta{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px}
  .item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .pcard .head{display:flex;gap:12px;align-items:flex-start}
  .pcard h3{margin:0;font-size:16px;letter-spacing:-.01em}
  .pcard .slug{color:var(--muted);font-size:12px;font-family:ui-monospace,Consolas,monospace}
  .pcard .figs{display:flex;gap:16px;align-items:center;margin:14px 0 10px}
  .pcard .figs .bars{flex:1;min-width:0}
  .person{display:flex;flex-direction:column;gap:10px}
  .person .head{display:flex;gap:14px;align-items:center}
  .person h3{margin:0;font-size:16px}
  .person .org{color:var(--muted);font-size:12.5px}
  .agent .head{display:flex;gap:14px;align-items:center}
  .agent h3{margin:0;font-size:15px;font-family:ui-monospace,Consolas,monospace}
  .agent .role{color:var(--muted);font-size:12.5px}
  .agent p{margin:10px 0 8px;color:var(--fg-2);font-size:13px}
  .log{display:flex;flex-direction:column}
  .log .row{display:grid;grid-template-columns:52px 150px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
  .log .row:last-child{border-bottom:0}
  .log .tm{color:var(--muted);font-variant-numeric:tabular-nums}
  .log .tg{font-family:ui-monospace,Consolas,monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .md h1,.md h2,.md h3{font-size:13.5px;margin:14px 0 6px;color:var(--fg-2)}.md h1:first-child,.md h2:first-child{margin-top:0}
  .md ul{margin:4px 0;padding-left:20px}.md table{margin:6px 0}.md p{margin:4px 0}
  details.card>summary{cursor:pointer;color:var(--fg-2);font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;list-style:none}
  details.card>summary::-webkit-details-marker{display:none}
  details.card>summary .ic{width:15px;height:15px;color:var(--muted);transition:transform .2s}
  details.card[open]>summary .ic{transform:rotate(90deg)}
  details.card[open]>summary{margin-bottom:12px}
  details.sub summary{cursor:pointer;color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px;list-style:none}
  details.sub summary::-webkit-details-marker{display:none}
  details.sub .ic{width:13px;height:13px}
  .banner{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:var(--r-s);padding:10px 14px;margin-bottom:16px;font-size:13px}
  .banner .ic{width:18px;height:18px}

  /* ---------- toast / dialog ---------- */
  .toast{position:fixed;right:20px;bottom:20px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;max-width:60vw;display:flex;gap:8px;align-items:center;font-size:13px;z-index:20;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:none}
  .toast .ic{width:16px;height:16px}
  dialog{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:16px;padding:0;width:min(520px,calc(100vw - 32px));box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
  dialog::backdrop{background:rgba(10,12,20,.45);backdrop-filter:blur(3px)}
  dialog form{padding:20px 22px}
  dialog h2{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:8px}
  dialog h2 .ic{width:18px;height:18px;color:var(--accent)}
  dialog label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .iconpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .iconpick button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--fg-2)}
  .iconpick button:hover,.iconpick button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .iconpick .ic{width:16px;height:16px}

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    .searchbox{min-width:0;flex:1}.userchip{display:none}
    .app{grid-template-columns:1fr}
    aside{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
    nav.side{flex-direction:row;gap:2px}nav.side button{padding:7px 10px}nav.side button span.lbl{display:none}nav.side .cnt{margin-left:2px}
    .brand b,.brand small{display:none}.side-foot{display:none}.userchip .rl{display:none}
    .topbar{padding:12px 16px}.content{padding:16px 16px 48px}.grid-2{grid-template-columns:1fr}
    .log .row{grid-template-columns:48px 1fr;grid-auto-rows:auto}.log .row .st{grid-column:2}
  }
</style>

<script>
/* ------------------------------------------------------------ helpers */
const TABS=[
  ["today","今日","sun","期限・inbox・未承認の提案・situation"],
  ["commitments","タスク","check-square","誰がやるか（自分・人・エージェント）と状態で見るタスク一覧。約束台帳がもと"],
  ["inbox","inbox","inbox","「覚えておいて」の受け皿。分類して記録先へ"],
  ["projects","案件","folder","進行中プロジェクトの座標・期限・約束"],
  ["people","人物","users","関係者の思考モデル（/simulate の素材）"],
  ["decisions","決定","badge-check","提案（未承認）→ 決定 → 検証"],
  ["knowledge","知識","book","用語集と業務ルール（秘書が依頼を解読し、判断の前提にする）"],
  ["team","チーム","sparkles","AI秘書チーム：@chief と専門家"],
  ["log","操作ログ","activity","フックが自動記録した外部操作"]];
const ICONS=new Set([...document.querySelectorAll("symbol")].map(s=>s.id.slice(2)));
const PICK=["user","crown","briefcase","star","heart","building","flag","shield","scale","calculator","bolt","server","chart","globe","lightbulb","palette","target","pen","message","layers"];
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val=s=>{s=String(s??"").trim();return /^（.*）$/.test(s)||s==="—"||s==="-"?"":s;};
const ic=(n,cls="ic")=>`<svg class="${cls}"><use href="#i-${n}"/></svg>`;
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.codePointAt(0))%360;return h;};
function glyph(icon,fallback){icon=val(icon);if(icon&&ICONS.has(icon))return ic(icon);if(icon)return `<span class="emoji">${esc(icon)}</span>`;return esc(initials(fallback));}
function initials(s){s=val(s);if(!s)return "?";const parts=s.split(/[\s　]+/).filter(Boolean);if(/^[A-Za-z@]/.test(s))return parts.map(p=>p.replace(/^@/,"")[0]).join("").slice(0,2).toUpperCase();return parts[0].slice(0,1);}
const avatar=(icon,name,size="",seed)=>`<span class="av ${size}" style="--h:${hue(seed||name)}" title="${esc(name)}">${glyph(icon,name)}</span>`;
const api=async(p,body)=>{const r=await fetch(p,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{});const j=await r.json();if(body){toast(j.ok?j.message:j.error,j.ok?"check":"alert");if(j.ok)refresh();}return j;};
function toast(m,icon="check"){const t=$("#toast");t.innerHTML=ic(icon)+`<span>${esc(m)}</span>`;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),3800);}
function relDays(n){if(n==null)return"";if(n<0)return`${-n}日超過`;if(n===0)return"今日";if(n===1)return"明日";return`${n}日後`;}
function due(d,n,icon="calendar"){d=val(d);if(!d||d==="なし")return `<span class="due none">${ic("calendar")}—</span>`;const cls=n==null?"":n<0?"over":n<=3?"soon":"";return `<span class="due ${cls}">${ic(n!=null&&n<0?"alert":icon)}${esc(d)}${n==null?"":` <span class="muted small">${relDays(n)}</span>`}</span>`;}
const KIND={task:["自分","user","t-info"],received:["受けた","arrow-in","t-warn"],given:["出した","arrow-out","t-accent"]};
const STATE={open:["未着手","circle"],"in-progress":["進行中","play"],waiting:["相手待ち","hourglass"],done:["完了","archive"],dropped:["取り下げ","x"]};
const isClosed=r=>r["状態"]==="done"||r["状態"]==="dropped";
const kindBadge=k=>{const [l,i,c]=KIND[k]||[k,"tag","t-muted"];return `<span class="badge ${c}">${ic(i)}${l}</span>`;};
function decBadge(st){const c=st.startsWith("提案")?"t-warn":st.startsWith("検証")?"t-ok":st.startsWith("決定")?"t-accent":"t-muted";const i=st.startsWith("提案")?"lightbulb":st.startsWith("検証")?"badge-check":"check";return `<span class="badge ${c}">${ic(i)}${esc(st)}</span>`;}
function lvMeter(lv){const n=parseInt((lv||"Lv0").replace("Lv",""))||0;return `<span class="lv" title="人物モデルの成熟度（Lv2 以上で /simulate 実用）"><span class="segs">${[1,2,3].map(i=>`<i class="${n>=i?"on":""}"></i>`).join("")}</span>${esc(lv||"Lv0")}</span>`;}
function ring(done,total){const r=24,c=2*Math.PI*r,p=total?done/total:0;return `<div class="ring" title="約束 完了 ${done} / ${total}"><svg width="56" height="56" viewBox="0 0 56 56"><circle class="bg" cx="28" cy="28" r="${r}"/><circle class="fg" cx="28" cy="28" r="${r}" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}"/></svg><div class="c">${total?`${done}<small>/${total}</small>`:`<small>約束なし</small>`}</div></div>`;}
function deadlineBar(p){const d=val(p.deadline);if(!d)return `<div class="bar"><i style="width:0"></i></div><div class="bar-l"><span>期限 未設定</span><span></span></div>`;
  const left=p.deadline_in,span=p.start_in!=null&&p.start_in<0?(-p.start_in+Math.max(left,0)):365;const elapsed=span-Math.max(left,0);let pct=Math.min(100,Math.max(0,elapsed/span*100));if(left<0)pct=100;
  const cls=left<0?"danger":left<=14?"danger":left<=45?"warn":"";return `<div class="bar ${cls}"><i style="width:${pct.toFixed(0)}%"></i></div><div class="bar-l"><span>${val(p.start)?`開始 ${esc(p.start)}`:"進捗（期限までの目安）"}</span><span>${due(d,left)}</span></div>`;}
function empty(msg,icon="inbox"){return `<div class="empty">${ic(icon)}<span>${esc(msg)}</span></div>`;}
function md(src){const out=[];let lines=(src||"").split("\n"),i=0;const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  while(i<lines.length){const l=lines[i];
    if(/^\|/.test(l)&&/^\|\s*:?-{2,}/.test(lines[i+1]||"")){const hdr=l.split("|").slice(1,-1);i+=2;let rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i].split("|").slice(1,-1));i++;}
      out.push("<table><tr>"+hdr.map(h=>`<th>${inline(h.trim())}</th>`).join("")+"</tr>"+rows.filter(r=>!/（未登録|記録なし）/.test(r.join(""))).map(r=>"<tr>"+r.map(c=>`<td>${inline(c.trim())}</td>`).join("")+"</tr>").join("")+"</table>");continue;}
    const h=/^(#{1,3})\s+(.*)/.exec(l);if(h){out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);i++;continue;}
    if(/^\s*[-*]\s+/.test(l)){let items=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){items.push(`<li>${inline(lines[i].replace(/^\s*[-*]\s+/,""))}</li>`);i++;}out.push("<ul>"+items.join("")+"</ul>");continue;}
    if(/^>/.test(l)||/^---/.test(l)||!l.trim()){i++;continue;}
    out.push(`<p>${inline(l)}</p>`);i++;}
  return `<div class="md">${out.join("")}</div>`;}

/* ------------------------------------------------------------ actions（inline onclick を避け、payload は表に置く） */
const ACT=new Map();let actSeq=0;
const act=(label,icon,fn,cls="")=>{const id=++actSeq;ACT.set(id,fn);return `<button class="btn ${cls}" data-act="${id}">${icon?ic(icon):""}${label}</button>`;};
const actRaw=(html,fn,cls="")=>{const id=++actSeq;ACT.set(id,fn);return `<button class="${cls}" data-act="${id}">${html}</button>`;};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const fn=ACT.get(+b.dataset.act);if(fn)fn(b);});

function dialog({title,icon="pen",fields,submit="保存"}){return new Promise(res=>{const d=$("#dlg");
  d.innerHTML=`<form method="dialog"><h2>${ic(icon)}${esc(title)}</h2>${fields.map(f=>`<label>${esc(f.label)}${f.type==="textarea"?`<textarea name="${f.name}" placeholder="${esc(f.placeholder||"")}" ${f.required?"required":""}>${esc(f.value||"")}</textarea>`:f.type==="select"?`<select name="${f.name}">${(f.options||[]).map(([v,l])=>`<option value="${esc(v)}" ${v===f.value?"selected":""}>${esc(l)}</option>`).join("")}</select>`:f.type==="icons"?`<input name="${f.name}" value="${esc(f.value||"")}" placeholder="${esc(f.placeholder||"")}"><div class="iconpick">${PICK.map(n=>`<button type="button" data-pick="${n}" title="${n}">${ic(n)}</button>`).join("")}</div>`:`<input type="${f.type||"text"}" name="${f.name}" value="${esc(f.value||"")}" placeholder="${esc(f.placeholder||"")}" ${f.required?"required":""} ${f.step?`step="${f.step}"`:""} ${f.min!=null?`min="${f.min}"`:""} ${f.max!=null?`max="${f.max}"`:""}>`}</label>`).join("")}
    <div class="actions"><button type="button" class="btn" data-cancel>${ic("x")}キャンセル</button><button class="btn primary" value="ok">${ic("check")}${esc(submit)}</button></div></form>`;
  d.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const inp=b.closest("label").querySelector("input");inp.value=b.dataset.pick;d.querySelectorAll("[data-pick]").forEach(x=>x.classList.toggle("on",x===b));});
  $("[data-cancel]",d).onclick=()=>{d.close("cancel");};
  d.onclose=()=>{if(d.returnValue!=="ok"){res(null);return;}const o=Object.fromEntries(new FormData($("form",d)));res(o);};
  d.showModal();setTimeout(()=>$("input,textarea",d)?.focus(),30);});}

async function stopTask(r){const o=await dialog({title:`${r.ID} の作業を止める`,icon:"x",submit:"止める",fields:[{label:"理由（作業記録の途中の変更に残る）",name:"reason",placeholder:"例：会議が前倒しになり条件が変わった"}]});if(o)api("/api/task/stop",{id:r.ID,reason:o.reason||"ボードで停止"});}
function agentBadge(r){return r.agent_state==="running"?`<span class="badge t-ok live">稼働中</span>`:r.agent_state==="review"?(String((r.task_run||{}).verdict||"").startsWith("受け入れ")?`<span class="badge t-ok">${ic("badge-check")}確認役OK・承認待ち</span>`:/^(差し戻し|古い条件)/.test(String((r.task_run||{}).verdict||""))?`<span class="badge t-warn">${ic("alert")}${esc(String(r.task_run.verdict).slice(0,4))}</span>`:`<span class="badge t-warn">${ic("eye")}確認待ち</span>`):r.agent_state==="failed"?`<span class="badge t-danger">${ic("alert")}失敗</span>`:"";}
function reviewOptions(r){const me=String(r.who).replace(/^@/,"");
  return [["auto","秘書が難易度で判断"],["none","レビューなし"],...(S.agents.agents||[]).filter(a=>a.handle!=="chief"&&a.handle!==me).map(a=>[a.handle,`@${a.handle} がレビュー`])];}
function planLabel(p){const v=(p||{}).review;return !v||v==="auto"?"レビュー：秘書が判断":v==="none"?"レビューなし":`レビュー：@${v}`;}
async function runTask(r){const o=await dialog({title:`${r.ID} を ${r.who} に着手させる`,icon:"sparkles",submit:"着手させる",
    fields:[{label:"レビュー（作った本人とは別のエージェントが見る）",name:"review",type:"select",value:(r.plan||{}).review||"auto",options:reviewOptions(r)},
            {label:"1回の上限（USD）。レビューありは作成・レビュー・直しの3人分で 2.5 が目安。記憶や外部サービスは変えない",name:"budget",type:"number",value:((r.plan||{}).review==="none"?"1":"2.5"),step:"0.1",min:"0.1",max:"20",required:true}]});
  if(o)api("/api/task/run",{id:r.ID,budget:String(o.budget),review:o.review});}
async function editPlan(r){const o=await dialog({title:`${r.ID} の進め方`,icon:"eye",fields:[{label:"レビュー",name:"review",type:"select",value:(r.plan||{}).review||"auto",options:reviewOptions(r)},{label:"理由（任意）",name:"reason",value:(r.plan||{}).reason||""}]});
  if(o)api("/api/task/plan",{id:r.ID,review:o.review,reason:o.reason});}
function reviewBadge(r){const v=(r.review||{}).verdict||"";if(!v)return "";const who=(r.review||{}).reviewer||"";
  if(/^なし/.test(v))return `<span class="badge t-muted">レビューなし</span>`;
  const ok=/^OK/i.test(v);const fixed=/修正済/.test(v);
  return `<span class="badge ${ok?"t-ok":fixed?"t-info":"t-warn"}" title="${esc(v)}">${ic(ok||fixed?"badge-check":"alert")}${esc(who)} ${ok?"OK":fixed?"指摘→修正済":"指摘あり"}${r.review.left?"・残りあり":""}</span>`;}
async function showReport(r){const x=await fetch("/api/task/result?id="+encodeURIComponent(r.ID)).then(j=>j.json());const d=$("#dlg");d.classList.add("wide");
  const st=x.status||{};const failed=st.state==="failed"||st.state==="unknown";const closed=isClosed(r);
  const runs=x.runs||[];const vb=st.verdict?`<span class="badge ${/^受け入れ/.test(st.verdict)?"t-ok":/古い条件|差し戻し/.test(st.verdict)?"t-warn":"t-info"}">${ic("badge-check")}確認役：${esc(st.verdict)}</span>`:"";
  d.innerHTML=`<form method="dialog"><h2>${ic("file")}${esc(x.run||r.ID)} の報告 ${vb} <span class="muted" style="font-weight:500;font-size:13px">${esc(r.who)}${st.cost_usd!=null?" ・ "+st.cost_usd.toFixed(2)+" USD":""}${st.end?" ・ "+new Date(st.end*1000).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):""}</span></h2>
    ${x.text?md(x.text):empty(failed?"報告が書かれずに終わりました（下のログを見てください）":"まだ報告がありません","file")}
    ${failed||(!x.text&&(x.log||[]).length)?`<pre class="small muted" style="white-space:pre-wrap;max-height:180px;overflow:auto">${esc((x.log||[]).join(String.fromCharCode(10)))}</pre>`:""}
    ${(x.notes||[]).length?`<details><summary class="small">${ic("bolt")}途中の変更（${x.notes.length}）</summary><ul class="small">${x.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></details>`:""}
    ${x.handoff?`<details><summary class="small">${ic("file")}引き継ぎ</summary><div class="small" style="white-space:pre-wrap">${esc(x.handoff)}</div></details>`:""}
    ${runs.length>1?`<details><summary class="small">${ic("clock")}実行履歴（${runs.length}）</summary><div class="tscroll"><table class="small"><tr><th>実行ID</th><th>開始</th><th>結果</th><th>費用</th><th>判定</th></tr>${runs.map(u=>`<tr><td class="mono">${esc(u["実行ID"])}</td><td>${esc(u["開始"])}</td><td>${esc(u["結果"])}</td><td>${esc(u["費用"])}</td><td>${esc(u["判定"])}</td></tr>`).join("")}</table></div></details>`:""}
    <div class="actions"><button type="button" class="btn" data-x>${ic("x")}閉じる</button>${x.text&&!closed?`<button type="button" class="btn primary" data-ok>${ic("check")}承認して完了</button>`:""}</div></form>`;
  $("[data-x]",d).onclick=()=>d.close();const ok=$("[data-ok]",d);if(ok)ok.onclick=()=>{d.close();api("/api/task/approve",{id:r.ID});};
  d.onclose=()=>d.classList.remove("wide");d.showModal();}
async function editContent(r){const o=await dialog({title:`${r.ID} の内容を書き換える`,icon:"pen",fields:[{label:"内容",name:"content",value:r.content,required:true}]});if(o&&o.content)api("/api/commitment/content",{id:r.ID,content:o.content});}
function taskCard(r){return `<div class="tcard ${r.assignee==="agent"?"agent":""}"><div class="top">${assigneeAvatar(r)}<div class="ct">${esc(r.content)}</div></div>
  <div class="meta"><span class="mono">${esc(r.ID)}</span><span>${assigneeLabel(r)}</span>${due(r["期限"],r.due_in)}${val(r["関連"])?`<span class="chip">${ic("tag")}${esc(r["関連"].replace(/`/g,""))}</span>`:""}${agentBadge(r)}${reviewBadge(r)}${changeBadges(r)}${r.assignee==="agent"&&!isClosed(r)&&!r.has_result?actRaw(ic("eye")+esc(planLabel(r.plan)),()=>editPlan(r),"chip"):""}</div>
  ${r.assignee==="agent"&&(r.has_result||r.agent_state==="failed")?`<div class="acts">${act(r.has_result?"報告を見る":"ログを見る",r.has_result?"file":"alert",()=>showReport(r),r.has_result&&!isClosed(r)?"primary":"")}</div>`:""}

function renderCommitments(){
  const all=S.commitments.rows||[];

  const cols=[["open","未着手","circle"],["in-progress","進行中","play"],["waiting","相手待ち","hourglass"],["done","完了（最近）","archive"]];
  const recentDone=r=>{const m=/\d{4}-\d{2}-\d{2}/.exec(r["追加日"]||r["受領日"]||r["依頼日"]||"");return !m||((Date.now()-new Date(m[0]))/864e5)<45;};
  const board=`<div class="kanban">${cols.map(([st,l,i])=>{const cs=rows.filter(r=>r["状態"]===st&&(st!=="done"||recentDone(r)));
    return `<div class="kcol"><div class="kcol-h">${ic(i)}${l}<span class="n">${cs.length}</span></div>${cs.length?cs.map(taskCard).join(""):`<div class="muted small" style="padding:6px 4px">なし</div>`}</div>`;}).join("")}</div>`;
  const agents=(S.agents.agents||[]).filter(a=>a.handle!=="chief");
  $("#tab-commitments").innerHTML=`<div class="card"><div class="card-h">${ic("check-square")}タスク<span class="n">未完了 ${counts.all}</span><span class="right">${viewSeg}</span></div>
    <div class="filters">${whoBtn("all","すべて","layers")}${whoBtn("self","自分","user")}${whoBtn("person","人に依頼","users")}${whoBtn("agent","エージェント","sparkles")}</div>
    ${taskView==="board"?board:comTable(rows.filter(r=>!isClosed(r)))}
    <form class="panel" id="f-com">
      <label><span>${ic("user")}誰がやる</span><select name="assign" id="f-assign"><option value="self">自分</option><option value="received">自分（人から受けた）</option><option value="person">人に依頼</option>${agents.map(a=>`<option value="@${esc(a.handle)}">@${esc(a.handle)}（エージェント）</option>`).join("")}</select></label>
      <label class="wide"><span>${ic("pen")}内容</span><input type="text" name="content" placeholder="何をするか" required></label>
      <label><span>${ic("users")}依頼者 / 相手</span><input type="text" name="who" placeholder="受けた・依頼のとき"></label>
      <label><span>${ic("calendar")}期限</span><input type="date" name="due"></label>
      <label><span>${ic("eye")}フォロー日</span><input type="date" name="follow" title="人に依頼したとき"></label>
      <label><span>${ic("folder")}関連</span><input type="text" name="rel" placeholder="P:slug / チケット"></label>
      <button class="btn primary">${ic("plus")}追加</button></form>
    <div class="muted small" style="margin-top:8px">エージェントに任せたタスクは、動いている間「稼働中」、終わると「確認待ち」。「着手させる」で無人で進め（費用は上限まで）、届いた報告を読んで「承認して完了」。承認した内容は次の会話で秘書が記憶に入れる。</div></div>`;
  $("#f-com").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const a=d.assign;delete d.assign;

    Object.keys(d).forEach(k=>{if(!d[k])delete d[k];});await api("/api/commitment/add",d);e.target.reset();};}

let kq="";
function renderKnowledge(){const K=S.knowledge||{},q=kq.trim().toLowerCase();
  const terms=(K.terms||[]).filter(t=>!q||JSON.stringify(t).toLowerCase().includes(q));
  const rules=(K.rules||[]).filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));
  const stale=r=>r["状態"]==="有効"&&r.confirmed_days!=null&&r.confirmed_days>180;
  $("#tab-knowledge").innerHTML=`<div class="card" style="margin-bottom:14px"><div class="searchbox" style="min-width:0">${ic("search")}<input id="kq" placeholder="用語・ルールを絞り込む" value="${esc(kq)}"></div></div>
  <div class="grid-2">
    <div class="card"><div class="card-h">${ic("book")}用語集<span class="n">${terms.length}</span><span class="right">依頼の前に秘書が解読に使う</span></div>
      ${terms.length?`<div class="tscroll"><table><thead><tr><th>用語</th><th>意味</th><th>種別</th><th>範囲</th></tr></thead><tbody>${terms.map(t=>`<tr><td class="nw"><b>${esc(t["用語"])}</b>${t["別表記"]?`<div class="muted small">${esc(t["別表記"])}</div>`:""}</td><td>${esc(t["意味"])}<div class="muted small">${esc(t["出典"]||"")} ・ ${esc(t["更新日"]||"")}</div></td><td class="nw"><span class="chip">${esc(t["種別"]||"")}</span></td><td class="nw">${esc(t["範囲"]||"")}</td></tr>`).join("")}</tbody></table></div>`:empty("用語はまだありません。「PSR はパイプライン状況報告のこと」と話すか、下から追加","book")}
      <form class="panel" id="f-term"><label><span>${ic("tag")}用語</span><input name="term" required placeholder="PSR"></label><label class="wide"><span>${ic("pen")}意味</span><input name="meaning" required placeholder="パイプライン状況報告（週次の営業資料）"></label><label><span>別表記</span><input name="aliases" placeholder="パイプライン報告"></label><label><span>種別</span><select name="kind_term"><option>略語</option><option selected>社内用語</option><option>コードネーム</option><option>あだ名</option><option>業界用語</option></select></label><label><span>範囲</span><input name="scope" placeholder="全社 / P:slug"></label><button class="btn primary">${ic("plus")}用語を追加</button></form></div>
    <div class="card"><div class="card-h">${ic("shield")}業務ルール<span class="n">${rules.filter(r=>r["状態"]==="有効").length}</span><span class="right">出典と確認日つき</span></div>
      ${rules.length?rules.map(r=>`<div class="item"><div class="av sm" style="--h:${hue(r.ID||"")}">${ic(r["状態"]==="有効"?"shield":"archive")}</div><div class="body"><div class="ttl"><span class="mono muted">${esc(r.ID)}</span><span>${esc(r["内容"])}</span>${r["状態"]!=="有効"?`<span class="badge t-muted">${esc(r["状態"])}</span>`:""}${stale(r)?`<span class="badge t-warn">${ic("clock")}確認から${r.confirmed_days}日</span>`:""}</div>
        <div class="meta"><span>${ic("file")} ${esc(r["出典"])}</span><span>${ic("tag")} ${esc(r["適用範囲"]||"")}</span><span>${ic("eye")} 確認 ${esc(r["確認日"]||"")}</span></div>
        ${r["状態"]==="有効"?`<div class="acts">${act("今も有効と確認","check",()=>api("/api/rule/confirm",{rid:r.ID}))}</div>`:""}</div></div>`).join(""):empty("業務ルールはまだありません。出典つきで話すか、下から追加","shield")}
      <form class="panel" id="f-rule"><label class="wide"><span>${ic("pen")}内容</span><input name="content" required placeholder="経費精算は翌月5営業日までに申請"></label><label><span>${ic("file")}出典</span><input name="source" required placeholder="経費規程 第4条"></label><label><span>適用範囲</span><input name="scope" placeholder="全社"></label><label><span>有効日</span><input type="date" name="effective"></label><button class="btn primary">${ic("plus")}ルールを追加</button></form></div>
  </div>`;
  const qi=$("#kq");qi.oninput=e=>{kq=e.target.value;renderKnowledge();const n=$("#kq");n.focus();n.setSelectionRange(n.value.length,n.value.length);};
  const post=(id,path)=>{$(id).onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));Object.keys(d).forEach(k=>{if(!d[k])delete d[k];});await api(path,d);};};
  post("#f-term","/api/term/add");post("#f-rule","/api/rule/add");}

/* --- team --- */
function fmtSec(n){n=n||0;return n<60?`${n}秒`:n<3600?`${Math.round(n/60)}分`:`${(n/3600).toFixed(1)}時間`;}
function runRow(r){const a=agentOf(r.agent);const st=r.state==="running"||r.state==="background"?`<span class="badge t-ok live">稼働中 ${fmtSec(r.elapsed)}</span>`:r.state==="done"?`<span class="badge t-muted">${ic("check")}${fmtSec(r.elapsed)}</span>`:r.state==="failed"?`<span class="badge t-danger">${ic("alert")}失敗</span>`:`<span class="badge t-muted">${ic("clock")}終了不明</span>`;
  return `<div class="run">${avatar(a?a.icon:"sparkles","@"+r.agent,"sm",r.agent)}<div style="min-width:0"><div><b>@${esc(r.agent)}</b> <span class="muted">${esc(r.start_hm)}${r.bg?" ・ バックグラウンド":""}${r.unattended?" ・ 無人実行":""}</span></div><div class="muted small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.desc||"（説明なし）")}${(r.tasks||[]).length?` ・ ${r.tasks.map(esc).join(" ")}`:""}</div></div>${st}</div>`;}
function activityList(n){const A=S.activity||{};const rows=[...(A.running||[]),...(A.recent||[])].slice(0,n);
  const u=A.unattended||{};const un=u.start?`<div class="run">${avatar("crown","@chief","sm","chief")}<div><b>@chief（無人実行）</b> <span class="muted">朝のブリーフ ${esc(u.start)}</span></div>${u.running?`<span class="badge t-ok live">稼働中</span>`:`<span class="badge ${u.exit==="0"?"t-muted":"t-danger"}">${u.exit==="0"?ic("check")+"完了":ic("alert")+"終了 "+esc(u.exit||"?")}</span>`}</div>`:"";
  return rows.length||un?un+rows.map(runRow).join(""):empty("まだ動きはありません。/consult や「@generalist に任せて」でエージェントが動くとここに出ます","sparkles");}
function renderTeam(){const ag=S.agents.agents||[];const by=(S.activity||{}).by_agent||{};
  const status=h=>{const b=by[h];if(!b)return `<span class="muted small">${ic("clock")} まだ動いていない</span>`;return b.running?`<span class="badge t-ok live">稼働中 ${b.running}</span> <span class="muted small">${esc(b.last_desc)}</span>`:`<span class="muted small">${ic("clock")} 最終 ${esc(b.last)} ・ 今日 ${b.today} 回</span>`;};
  const tasksOf=h=>(S.commitments.rows||[]).filter(r=>r.assignee==="agent"&&String(r.who).replace(/^@/,"")===h&&!isClosed(r));
  $("#tab-team").innerHTML=`${autopilotCard()}<div class="card" style="margin-bottom:14px"><div class="card-h">${ic("activity")}最近の動き<span class="n">${((S.activity||{}).running||[]).length} 稼働中</span><span class="right">会話の中で起動されたエージェント（フックが記録）</span></div>${activityList(15)}</div>
  <div class="grid">${ag.map(a=>`<div class="card agent"><div class="head">${avatar(a.icon,"@"+a.handle,"lg",a.handle)}<div style="flex:1;min-width:0"><h3>@${esc(a.handle)}</h3><div class="role">${esc(val(a.role)||"—")}</div></div>${a.handle==="chief"?`<span class="badge t-accent">${ic("crown")}司会</span>`:""}</div>
    <div style="margin-top:8px">${a.handle==="chief"?`<span class="muted small">会話の相手。記憶へ書くのは @chief だけ</span>`:status(a.handle)}</div>
    ${tasksOf(a.handle).length?`<div style="margin-top:8px">${tasksOf(a.handle).map(r=>`<div class="small">${ic("check-square")} <span class="mono muted">${esc(r.ID)}</span> ${esc(r.content)} ${agentBadge(r)}</div>`).join("")}</div>`:""}
    <p>${esc(a.description)}</p>
    <div class="chips">${(a.skills||[]).map(s=>`<span class="chip">${ic("layers")}${esc(s)}</span>`).join("")}${a.path?`<span class="chip mono" title="frontmatter の icon: を変えるとアイコンが変わります">${ic("file")}${esc(a.path)}</span>`:`<span class="chip">${ic("file")}CLAUDE.md §1</span>`}</div></div>`).join("")}</div>
  <div class="card" style="margin-top:14px"><div class="card-h">${ic("palette")}アイコンの設定</div><div class="small" style="color:var(--fg-2)">専門家：<code>.claude/agents/{handle}.md</code> の frontmatter に <code>icon: calculator</code> のようにアイコン名か絵文字を書く。人物：人物カードの「アイコン」ボタン、または <code>python tools/mem.py person set-icon {識別子} 👔</code>。使えるアイコン名：</div>
    <div class="chips" style="margin-top:8px">${PICK.concat(["users","folder","sparkles","git","terminal","send"]).map(n=>`<span class="chip">${ic(n)}${n}</span>`).join("")}</div></div>`;}

/* --- log --- */
function renderLog(){const items=S.oplog.items||[];const cat=c=>{const t=/失敗/.test(c.status)?"t-danger":/^memory/.test(c.category)?"t-accent":/^git|^gh/.test(c.category)?"t-info":/^mem:/.test(c.category)?"t-ok":"t-muted";const i=/^git|^gh/.test(c.category)?"git":/^memory|^mem:/.test(c.category)?"file":/:/.test(c.category)?"globe":"terminal";return `<span class="badge ${t}">${ic(i)}${esc(c.category||"—")}</span>`;};
  const stat=s=>{const t=/失敗/.test(s)?"t-danger":/承認済/.test(s)?"t-ok":"t-muted";return `<span class="badge ${t} st">${ic(/失敗/.test(s)?"alert":/承認済/.test(s)?"check":"bolt")}${esc(s||"—")}</span>`;};
  $("#tab-log").innerHTML=`<div class="card"><div class="card-h">${ic("activity")}操作ログ<span class="n">直近 ${items.length}</span><span class="right">${ic("file")}memory/task-log ・ フックが自動記録</span></div>
    ${items.length?`<div class="log">${items.map(c=>`<div class="row"><span class="tm">${esc(c.time)}</span>${cat(c)}<span class="tg" title="${esc(c.target)}">${esc(c.target)}</span>${stat(c.status)}</div>`).join("")}</div>`:empty("記録なし。会話で memory/ に書くと自動で残ります","activity")}</div>`;}

/* ------------------------------------------------------------ nav / theme */
function show(k){cur=k;TABS.forEach(([t,l,i,sub])=>{$("#tab-"+t).classList.toggle("active",t===k);if(t===k){$("#title").innerHTML=ic(i)+esc(l);$("#subtitle").textContent=sub;}});$("#nav").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.tab===k));try{localStorage.setItem("board.tab",k);}catch(e){}}
const THEMES=["auto","light","dark"];let theme="auto";try{theme=localStorage.getItem("board.theme")||"auto";}catch(e){}
function applyTheme(){if(theme==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",theme);$("#theme").innerHTML=ic(theme==="dark"?"moon":theme==="light"?"sun":"sparkles");$("#theme").title=`テーマ: ${theme}`;}
$("#theme").onclick=()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%3];try{localStorage.setItem("board.theme",theme);}catch(e){}applyTheme();};
$("#refresh").onclick=()=>{refresh();toast("再読込しました","refresh");};
applyTheme();
let initial="today";try{initial=localStorage.getItem("board.tab")||"today";}catch(e){}
cur=TABS.some(([t])=>t===initial)?initial:"today";show(cur);refresh();setInterval(()=>{const busy=(S.commitments?.rows||[]).some(r=>r.agent_state==="running")||(S.activity?.running||[]).length;if(busy||++tick%3===0)refresh();},10000);
</script>
</body>
</html>
