name: test

# 記憶の道具（mem.py / recall.py）・フック・ボードの API・配布物の構造を、push と PR のたびに確かめる。
# 標準ライブラリだけ（unittest）なので依存のインストールは無い。Windows（文字コード・改行・PowerShell）と macOS（python3 だけの環境）も回す。
on:
  push:
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.12"]   # 3.9 は macOS 標準（Xcode Command Line Tools）の Python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unittest
        run: python -m unittest discover -s tests -t tests -v
